PROTOTYPE PLAN — Issue #21 / DBX migration wizard
Question: which journey makes a high-stakes, 200-table migration understandable to a non-developer DBA?
Assumptions: one source/target pair; table rows are illustrative; mutations are in-memory only; static HTML is intentionally throwaway.
Thesis: A = reassurance through a linear six-stage wizard. B = surface exceptions first in an operations workbench. C = reduce the task to three decisions, with details on demand.
Variant switch is URL-stable: ?variant=A|B|C. No dependencies.
-->

place-items:center}.selected .radio{border-color:var(--blue)}.selected .radio:after{content:"";width:7px;height:7px;background:var(--blue);border-radius:50%}.btn{border:1px solid #cbd3e2;background:#fff;color:var(--ink);border-radius:4px;padding:7px 12px;font-weight:600}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red);border-color:#eab3b3}.btn.small{padding:4px 8px;font-size:12px}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}.actions-right{display:flex;gap:8px}.form-row{display:flex;gap:9px;align-items:center;margin:8px 0}.form-row label{width:84px;color:var(--muted)}input,select{border:1px solid #cbd3e2;border-radius:4px;padding:7px 8px;background:#fff;color:var(--ink)}input:focus,button:focus,select:focus{outline:3px solid #315efb35;outline-offset:1px}.full{width:100%}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{border:1px solid var(--line);padding:11px;border-radius:5px}.stat b{font-size:21px;display:block}.stat span{font-size:11px;color:var(--muted)}.stat.safe b{color:var(--green)}.stat.risky b{color:var(--amber)}.stat.blocked b{color:var(--red)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:4px}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:10px 0}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}.table th{background:#fafbfe;color:var(--muted);font-size:11px}.table tr:last-child td{border-bottom:0}.check{width:15px;height:15px;accent-color:var(--blue)}.tag{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 7px;font-size:11px;font-weight:700}.tag.safe,.tag.pass{color:var(--green);background:var(--green-bg)}.tag.risky,.tag.inconclusive{color:var(--amber);background:var(--amber-bg)}.tag.blocked,.tag.fail{color:var(--red);background:var(--red-bg)}.tag.running{color:var(--blue);background:var(--blue-weak)}.tag.neutral{color:var(--muted);background:#eef1f6}.risk{border-left:3px solid var(--amber);background:var(--amber-bg);padding:10px 12px;margin:8px 0;border-radius:3px}.risk.block{border-color:var(--red);background:var(--red-bg)}.risk strong{display:block}.code{background:#1d2638;color:#d7e2fa;padding:15px;border-radius:4px;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto;white-space:pre}.readonly{position:relative}.readonly:after{content:"只读 · 写入契约生成";position:absolute;right:9px;top:8px;color:#aebbd3;font-size:11px}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.checklist{list-style:none;padding:0;margin:0}.checklist li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}.freeze{display:flex;gap:10px;align-items:flex-start;background:#f6f8fc;border:1px solid var(--line);padding:12px;border-radius:4px}.freeze input{margin-top:4px}.progress{height:6px;background:#e7ebf2;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--blue);border-radius:99px}.progress.compact{width:130px;display:inline-block;vertical-align:middle}.run-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.run-progress{display:flex;align-items:center;gap:13px;margin:15px 0}.run-progress b{font-size:24px}.timeline{border-left:2px solid #dfe5ef;padding-left:18px;margin:15px 0}.event{position:relative;padding:0 0 15px}.event:before{content:"";position:absolute;left:-25px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px var(--blue-weak)}.event small{display:block;color:var(--muted)}.drawer{background:#fbfcff;border:1px solid var(--line);border-radius:5px;padding:14px}.bottom-switcher{position:fixed;bottom:16px;left:calc(50% + 112px);transform:translateX(-50%);background:#101a31; <aside class="sidebar" aria-label="DBX 主导航"><div class="side-brand"><span class="brand-mark">D</span><span>DBX</span></div><nav class="side-nav"><button class="active" onclick="toast('作业中心')"><span>▦</span><span>作业中心</span></button><button onclick="toast('数据源管理是独立配置面')"><span>◈</span><span>数据源</span></button><button onclick="toast('系统设置')"><span>⚙</span><span>系统设置</span></button></nav><div class="side-foot">迁移控制台 · 原型</div></aside><header class="appbar"><div class="brand"><span aria-label="收起导航">☰</span><span>作业中心 / 新建迁移</span></div><div class="app-actions"><span>帮助</span><span>通知 3</span><span class="user">王敏 · DBA ▾</span></div></header>
<main class="shell"><div class="topline"><div><div class="eyebrow">migration task / draft</div><h1 class="title">MySQL → PostgreSQL 数据迁移</h1><p class="subtitle">一次性迁移 200 张表 · 源端写入冻结后建立不可变基线</p></div><span class="variant-pill" id="variantPill"></span></div><div id="app"></div></main>
<nav class="bottom-switcher" aria-label="切换原型方案"><button data-variant="A">A · 线性向导</button><button data-variant="B">B · 异常工作台</button><button data-variant="C">C · 三个决策</button></nav><div class="toast" id="toast" role="status"></div>
<script>
const qs=new URLSearchParams(location.search);let variant=(qs.get('variant')||'A').toUpperCase();if(!['A','B','C'].includes(variant))variant='A';
const tables=Array.from({length:200},(_,i)=>({name:['users','orders','order_items','products','audit_log','customer_notes'][i%6]+(i>5?'_'+String(i+1).padStart(3,'0'):''),rows:[12480,892340,2400010,6800,12003450,902][i%6],size:[3.2,128.4,412.8,2.1,890.3,7.4][i%6],kind:[17,67,117,167].includes(i)?'blocked':i%5===0?'risky':'safe',selected:!([17,67,117,167].includes(i)),status:i<12?'done':i<15?'running':'waiting',progress:i<12?100:i<15?[64,41,18][i-12]:0,result:[4,10,11].includes(i)?'fail':[5,8].includes(i)?'inconclusive':i<12?'pass':null}));
const state={stage:0,search:'',sort:'rows',freeze:false,details:'orders',live:true,exclusions:4};
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function goStage(n){state.stage=Math.max(0,Math.min(5,n));render()}
function stepRail(){return `<aside class="rail"><div class="rail-title">创建迁移 · ${state.stage+1}/6</div>${['连接与范围','选择表','预检与契约','执行确认','运行监控','验证报告'].map((x,i)=>`<button class="step ${i===state.stage?'active':''} ${i<state.stage?'done':''}" onclick="goStage(${i})" aria-current="${i===state.stage?'step':'false'}"><span class="step-no">${i<state.stage?'✓':i+1}</span><span>${x}</span></button>`).join('')}</aside>`}
function actions(){return `<div class="actions"><button class="btn" onclick="goStage(${state.stage-1})" ${state.stage===0?'disabled':''}>上一步</button><div class="actions-right">${state.stage<5?`<button class="btn primary" onclick="goStage(${state.stage+1})">${state.stage===3?'开始迁移':'继续'}</button>`:`<button class="btn primary" onclick="rerun()">按失败项新建 rerun</button>`}</div></div>`}
function connection(){return `<section class="card"><h2>1. 选择已有连接</h2><p class="hint">连接在「数据源」中单独维护。向导只选择已验证的源端与目标端，不在迁移任务内保存新凭据。</p><div class="grid2"><div><div class="section-label">源端连接</div><div class="connection selected" onclick="toast('已选择 MySQL 生产库')"><div><strong>生产 MySQL · orders-prod</strong><small>10.21.8.14:3306 / commerce · TLS 已验证</small></div><span class="radio" aria-label="已选择"></span></div><div class="notice">✓ 最近检查通过 · MySQL 8.0.36 · utf8mb4 · 只读账号</div></div><div><div class="section-label">目标连接</div><div class="connection selected" onclick="toast('已选择 PostgreSQL 分析库')"><div><strong>分析 PostgreSQL · analytics-prod</strong><small>10.21.8.21:5432 / analytics · TLS 已验证</small></div><span class="radio" aria-label="已选择"></span></div><div class="form-row"><label>目标 schema</label><input class="full" value="commerce" aria-label="目标 schema"></div></div></div><a href="#" onclick="event.preventDefault();toast('请在数据源管理中添加或轮换连接')">前往数据源管理 →</a><div class="actions"><span class="muted">范围预设：200 张表 · 4 张明确排除</span><div class="actions-right"><button class="btn primary" onclick="goStage(1)">下一步：选择表</button></div></div></section>`}
function tableRows(){let a=tables.filter(t=>t.name.toLowerCase().includes(state.search.toLowerCase()));if(state.sort==='size')a.sort((x,y)=>y.size-x.size);return a.slice(0,18).map((t,i)=>`<tr><td><input class="check" type="checkbox" ${t.selected?'checked':''} onchange="toggleTable(${tables.indexOf(t)})" aria-label="选择 ${t.name}"></td><td><strong>${t.name}</strong></td><td>${t.rows.toLocaleString()}</td><td>${t.size} MB</td><td><span class="tag ${t.kind}">${t.kind==='safe'?'安全':t.kind==='risky'?'需确认':'阻断'}</span></td><td><button class="btn small" onclick="openDetails('${t.name}')">查看</button></td></tr>`).join('')}
function selection(){let selected=tables.filter(t=>t.selected).length;return `<section class="card"><h2>2. 选择表</h2><p class="hint">从源库树中选择迁移范围。支持搜索、全选、显式排除和排序；不使用正则表达式。</p><div class="split"><div class="drawer"><div class="section-label">源端对象树</div><div class="toolbar"><input id="search" placeholder="搜索库 / 表名" value="${state.search}" oninput="state.search=this.value;render()" aria-label="搜索表名"><button class="btn small" onclick="selectAll(true)">全选</button></div><div class="tree"><div>▾ <strong>commerce</strong></div><div style="padding:6px 0 6px 18px;color:var(--blue)">☑ 200 张表</div><div style="padding-left:28px;color:var(--muted);line-height:2">▣ customers<br>▣ orders<br>▣ order_items<br>▣ products<br>▣ audit_log<br>… 195 张表</div></div><div class="notice">当前范围 <strong>${selected}/200</strong> 张 · 已排除 ${state.exclusions} 张（明确记录）</div></div><div><div class="stat-grid"><div class="stat"><b>${selected}</b><span>已选择表</span></div><div class="stat"><b>${tables.filter(t=>t.selected).reduce((s,t)=>s+t.rows,0).toLocaleString()}</b><span>预计行数</span></div></div><div class="toolbar"><strong>已选表清单</strong><button class="btn small" onclick="state.sort=state.sort==='rows'?'size':'rows';render()">按${state.sort==='rows'?'大小':'行数'}排序</button></div><div class="table-wrap"><table class="table"><thead><tr><th></th><th>表名</th><th>行数</th><th>数据量</th><th>预检标签</th><th></th></tr></thead><tbody>${tableRows()}</tbody></table></div><p class="muted">显示前 18 项 · 排除表不会进入迁移或验证结果。</p></div></div>${actions()}</section>`}
function preflight(){return `<section class="card"><h2>3. 预检与契约审核</h2><p class="hint">先处理阻断与风险，再查看安全表。点击表可查看字段映射；DDL 单独位于只读标签页。</p><div class="stat-grid"><div class="stat blocked"><b>4</b><span>阻断 · 先处理</span></div><div class="stat risky"><b>8</b><span>风险 · 需确认</span></div><div class="stat safe"><b>188</b><span>安全 · 可批准</span></div><div class="stat"><b>200</b><span>预检总数</span></div></div><div class="risk block"><strong>阻断 · audit_log_017</strong>字段最大 22,104,320 bytes，超过 DBX v1 的 20 MiB 上限。<div style="margin-top:7px"><button class="btn small danger" onclick="excludeBlocker()">排除此表并重新预检</button> <button class="btn small" onclick="toast('打开裁剪字段方案（原型）')">裁剪超限字段</button> <button class="btn small" onclick="toast('无法忽略阻断项')">为何不能继续？</button></div></div><div class="risk"><strong>需确认 · customer_notes_005</strong>单值超过 1 MiB，建议隔离并降低吞吐。接受风险只记录 disposition，不改变技术结果。</div><div class="toolbar"><div><button class="btn small primary" onclick="showTab('mapping')">字段映射</button> <button class="btn small" onclick="showTab('ddl')">DDL · 只读</button></div><span class="muted">当前表：${state.details}</span></div><div id="mappingTab"><div class="table-wrap"><table class="table"><thead><tr><th>源字段</th><th>源类型</th><th>目标类型</th><th>可空</th><th>默认值</th><th>例外</th></tr></thead><tbody><tr><td><strong>id</strong></td><td>BIGINT</td><td><select aria-label="id 目标类型"><option>bigint</option></select></td><td>否</td><td>—</td><td><span class="tag safe">自动</span></td></tr><tr><td><strong>legacy_status</strong></td><td>ENUM</td><td><select aria-label="状态目标类型"><option>text</option></select></td><td>否</td><td>—</td><td><span class="tag risky">结构化例外</span></td></tr><tr><td><strong>total</strong></td><td>DECIMAL(12,2)</td><td><select aria-label="total 目标类型"><option>numeric(12,2)</option></select></td><td>是</td><td>NULL</td><td><span class="tag safe">自动</span></td></tr></tbody></table></div><div class="exception"><div class="exception-head"><strong>legacy_status · 值域保持</strong><button class="btn small" onclick="toast('结构化例外已保存（内存）')">编辑</button></div><p class="muted">ENUM → text；保留原值域，不允许改名或放宽不变式。布尔开关：保留精度 ✓ · 失败即阻断 ✓</p></div></div><div id="ddlTab" class="hidden"><div class="readonly"><pre class="code">01  CREATE TABLE commerce.orders (
02    id bigint NOT NULL,
03    legacy_status text NOT NULL,
04    total numeric(12,2),
05    PRIMARY KEY (id)
06  );</pre></div><p class="muted">只读渲染 · 由字段映射和写入契约生成。明确锁定，不能直接编辑 SQL。</p></div>${actions()}</section>`}
function confirm(){let selected=tables.filter(t=>t.selected).length;return `<section class="card"><h2>4. 执行确认</h2><p class="hint">这是一次紧凑的最后确认。确认后生成不可变 migration run，执行期间持续保持源端写入冻结。</p><div class="grid2"><div><div class="section-label">本次范围</div><ul class="checklist"><li><span>目标 schema</span><strong>commerce</strong></li><li><span>纳入表</span><strong>${selected} 张</strong></li><li><span>明确排除</span><strong>${state.exclusions} 张</strong></li><li><span>预计数据</span><strong>1.84 TB</strong></li><li><span>阻断项</span><strong class="tag pass">已排除，不参与验证</strong></li></ul></div><div><div class="section-label">写入冻结承诺</div><label class="freeze"><input type="checkbox" ${state.freeze?'checked':''} onchange="state.freeze=this.checked;render()"><span><strong>我确认源端 commerce 在基线捕获至验证结束前停止写入</strong><br><span class="muted">负责人：王敏 · 变更单：CHG-2026-0812 · 到期：今天 23:00</span></span></label><div class="notice">运行保存来源基线、连接版本、契约和 scope。不会创建或展示额外资源概念。</div></div></div><div class="actions"><button class="btn" onclick="goStage(2)">返回审核</button><button class="btn primary" onclick="state.freeze=true;goStage(4)">确认并进入监控</button></div></section>`}
function monitoring(){let done=tables.filter(t=>t.status==='done').length;return `<section class="card"><div class="run-head"><div><h2>5. 运行监控 · RUN-2026-0812-014</h2><p class="hint">系统按表持续更新迁移与验证状态；调度细节由 DBX 自动处理。</p></div><span class="tag running"><span class="icon">●</span>RUNNING</span></div><div class="run-progress"><b>${done}/196</b><div class="full"><div class="progress"><i style="width:${Math.round(done/196*100)}%"></i></div><small class="muted">表迁移完成 · 最后更新 14:32:08 · 3 组表正在执行</small></div></div><div class="toolbar"><strong>表级状态</strong><div><button class="btn small" onclick="state.live=!state.live;toast(state.live?'已开启模拟实时更新':'已暂停实时更新')">${state.live?'实时更新：开':'实时更新：关'}</button> <button class="btn small" onclick="openDetails('orders')">查看表时间线</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>表</th><th>阶段</th><th>进度</th><th>结果</th><th>更新时间</th></tr></thead><tbody>${tables.slice(0,12).map((t,i)=>`<tr><td><strong>${t.name}</strong></td><td>${t.status==='done'?'VALIDATING':t.status==='running'?'TRANSFERRING':'WAITING_FOR_BOX'}</td><td><span class="progress compact"><i style="width:${t.progress}%"></i></span> ${t.progress}%</td><td><span class="tag ${t.result==='fail'?'fail':t.result==='inconclusive'?'inconclusive':t.status==='done'?'pass':'neutral'}"><span class="icon">${t.result==='fail'?'!':t.result==='inconclusive'?'?':t.status==='done'?'✓':'·'}</span>${t.result==='fail'?'FAIL':t.result==='inconclusive'?'INCONCLUSIVE':t.status==='done'?'PASS':'等待'}</span></td><td class="muted">14:3${i}</td></tr>`).join('')}</tbody></table></div><div id="detail" class="drawer" style="margin-top:16px"><strong>orders · 表时间线</strong><div class="timeline"><div class="event"><strong>14:28 · 写入完成</strong><small>基线 892,340 行 · target count 一致</small></div><div class="event"><strong>14:31 · 验证开始</strong><small>行数、主键范围、抽样校验</small></div><div class="event"><strong>14:32 · 正在确认</strong><small>结果尚未终态；状态保持透明</small></div></div><button class="btn small" onclick="rerun()">失败/不确定项新建 rerun</button></div></section>`}
function report(){return `<section class="card"><h2>6. 验证报告</h2><p class="hint">技术结果与操作员的 validation disposition 分开记录；接受风险不会把 FAIL 改成 PASS。</p><div class="stat-grid"><div class="stat safe"><b>191</b><span>PASS · 技术结果</span></div><div class="stat blocked"><b>3</b><span>FAIL · 技术结果</span></div><div class="stat risky"><b>2</b><span>INCONCLUSIVE</span></div><div class="stat"><b>4</b><span>预检已排除</span></div></div><div class="risk block"><strong>FAIL · payments_044</strong>目标行数与冻结基线不一致，技术结果保持失败。建议查看时间线与诊断证据后，新建运行重迁。</div><div class="exception"><div class="exception-head"><strong>INCONCLUSIVE · customer_notes_005</strong><span class="tag inconclusive">技术结果未定</span></div><p class="muted">数值聚合校验超时，未能形成强结论；可修复权限/超时后新建运行，或记录接受风险。</p><button class="btn small" onclick="toast('已记录接受风险 disposition（不改变 INCONCLUSIVE）')">记录接受风险理由</button></div><div class="notice"><strong>运行结论：COMPLETED_WITH_FAILURES</strong><br>191 张表技术通过；3 张 FAIL、2 张 INCONCLUSIVE 可进入新运行；4 张预检阻断表未执行且不计入迁移结果。</div><div class="actions"><button class="btn" onclick="openDetails('payments_044')">打开诊断包</button><button class="btn primary" onclick="rerun()">按失败/不确定项新建运行</button></div></section>`}
function horizontalStepper(){return `<div class="stepper" aria-label="创建迁移步骤">${['连接','选表','预检','确认','监控','报告'].map((x,i)=>`${i?'<i></i>':''}<button class="${i===state.stage?'active':''}" onclick="goStage(${i})">${i+1} ${x}</button>`).join('')}</div>`}function variantA(){let body=[connection,selection,preflight,confirm,monitoring,report][state.stage]();return stepRail()+`<div class="content">${horizontalStepper()}${body}</div>`}
function variantB(){return `<div class="layout"><aside class="rail"><div class="rail-title">运行总览</div><div class="stat safe"><b>188</b><span>可安全执行</span></div><div class="stat risky"><b>8</b><span>待处理风险</span></div><div class="stat blocked"><b>4</b><span>已阻断</span></div><div class="section-label">例外优先</div>${['audit_log_017','customer_notes_005','orders.legacy_status'].map(x=>`<div class="step ${state.details===x?'active':''}" onclick="openDetails('${x}')"><span class="step-no">!</span><span>${x}<small class="muted">需要 DBA 决定</small></span></div>`).join('')}<div class="section-label">阶段</div>${['连接','范围','契约','确认','监控','报告'].map((x,i)=>`<div class="step ${i===state.stage?'active':''}" onclick="goStage(${i})"><span class="step-no">${i+1}</span><span>${x}</span></div>`).join('')}</aside><div class="content"><section class="card"><div class="run-head"><div><div class="eyebrow">B · exception-first workbench</div><h2>先处理会阻断运行的事</h2><p class="hint">左侧是当前必须做决定的例外；普通表可以稍后批量确认。</p></div><span class="tag risky">ATTENTION_REQUIRED</span></div><div class="decision"><div><strong>① 处理 4 个阻断项</strong><p>unsupported / inconclusive 不允许被忽略</p></div><button class="btn primary" onclick="openDetails('audit_log_017')">查看</button></div><div class="decision"><div><strong>② 确认 8 个可控风险</strong><p>大记录表将使用平台自动选择的隔离执行策略</p></div><button class="btn" onclick="openDetails('customer_notes_005')">查看</button></div><div class="decision"><div><strong>③ 连接、范围和冻结</strong><p>剩余 188 张普通表可一次确认</p></div><button class="btn" onclick="goStage(0)">查看</button></div></section><section class="card" id="workbenchDetail">${preflight().replace('<section class="card">','').replace('</section>','')}</section></div></div>`}
function variantC(){return `<div class="content"><section class="card"><div class="eyebrow">C · goal-oriented journey</div><h2>把迁移变成三个决定</h2><p class="hint">你不需要理解平台内部的执行资源；只需确认范围、风险和执行责任。</p><div class="decision"><div><strong><span class="icon">①</span>我要迁移哪些数据？</strong><p>orders-prod → analytics-prod / commerce · 196/200 张表</p></div><button class="btn primary" onclick="goStage(1)">确认范围</button></div><div class="decision"><div><strong><span class="icon">②</span>有哪些地方需要我承担风险？</strong><p><span class="tag blocked">4 阻断</span> <span class="tag risky">8 需确认</span> · 先看异常，再看 DDL</p></div><button class="btn" onclick="goStage(2)">审阅风险</button></div><div class="decision"><div><strong><span class="icon">③</span>什么时候可以安全开始？</strong><p>需要写入冻结 · 预计 1.84 TB · 完成后给出逐表验证报告</p></div><button class="btn" onclick="goStage(3)">确认并开始</button></div></section><div class="grid2"><section class="card"><h3>当前决定摘要</h3><ul class="checklist"><li><span>源端连接</span><span class="tag pass">已验证</span></li><li><span>结构化例外</span><span class="tag risky">1 项</span></li><li><span>DDL</span><span class="tag neutral">只读</span></li><li><span>写入冻结</span><span class="tag ${state.freeze?'pass':'risky'}">${state.freeze?'已确认':'待确认'}</span></li></ul></section><section class="card"><h3>运行后你会看到</h3><p class="muted">每张表都有阶段、进度、技术验证结果和时间线。FAIL / INCONCLUSIVE 与“接受风险”分开显示。</p><button class="btn small" onclick="goStage(4)">预览监控</button></section></div></div>`}
function showTab(tab){document.getElementById('mappingTab').classList.toggle('hidden',tab!=='mapping');document.getElementById('ddlTab').classList.toggle('hidden',tab!=='ddl')}function excludeBlocker(){[17,67,117,167].forEach(i=>tables[i].selected=false);state.exclusions=4;toast('4 个阻断表已明确排除，重新预检后进入范围摘要');render()}function openDetails(name){state.details=name;toast('已打开 '+name+' 的详情');if(variant==='B')render()}
function toggleTable(i){tables[i].selected=!tables[i].selected;render()};function selectAll(v){tables.forEach(t=>t.selected=v);state.exclusions=v?0:200;toast(v?'已选择可见范围':'已清空选择');render()};function rerun(){tables.forEach(t=>{t.selected=t.result==='fail'||t.result==='inconclusive'});state.exclusions=4;toast('已创建 rerun 草稿：仅包含失败/不确定且符合资格的表');state.stage=1;render()}
function render(){document.getElementById('variantPill').textContent=`方案 ${variant} · ${variant==='A'?'线性向导':variant==='B'?'异常工作台':'三个决定'}`;document.querySelectorAll('[data-variant]').forEach(b=>b.classList.toggle('active',b.dataset.variant===variant));document.getElementById('app').innerHTML=variant==='A'?`<div class="layout">${variantA()}</div>`:variant==='B'?variantB():variantC()}
document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;history.replaceState(null,'',`?variant=${variant}`);state.stage=0;render()});document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(e.key==='ArrowRight')goStage(state.stage+1);if(e.key==='ArrowLeft')goStage(state.stage-1)});render();
