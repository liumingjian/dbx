<!--
PROTOTYPE PLAN — Issue #21 / DBX migration wizard
Question: which journey makes a high-stakes, 200-table migration understandable to a non-developer DBA?
Assumptions: one source/target pair; table rows are illustrative; mutations are in-memory only; static HTML is intentionally throwaway.
Thesis: A = reassurance through a linear six-stage wizard. B = surface exceptions first in an operations workbench. C = reduce the task to three decisions, with details on demand.
Variant switch is URL-stable: ?variant=A|B|C. No dependencies.
-->

<style>
:root{--ink:#172033;--muted:#65718a;--line:#dfe5ef;--panel:#fff;--bg:#f5f7fb;--blue:#315efb;--blue-weak:#eef2ff;--green:#16845b;--green-bg:#eaf8f1;--amber:#a86700;--amber-bg:#fff6df;--red:#bd3c3c;--red-bg:#fff0f0;--purple:#7154c7;--shadow:0 8px 24px #24324b0d}*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer;border:0}.appbar{height:62px;background:#101a31;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-weight:750;letter-spacing:.02em;display:flex;align-items:center;gap:10px}.brand-mark{width:27px;height:27px;border-radius:7px;background:#fff;color:#315efb;display:grid;place-items:center;font-weight:900}.prototype-tag{font-size:11px;border:1px solid #ffffff55;border-radius:99px;padding:3px 9px;color:#dbe3ff}.app-actions{display:flex;align-items:center;gap:18px;color:#c9d2e8}.user{border:1px solid #ffffff30;padding:6px 10px;border-radius:6px}.shell{max-width:1320px;margin:0 auto;padding:26px 28px 106px}.topline{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:22px}.eyebrow{color:var(--blue);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.title{font-size:26px;margin:4px 0 4px;letter-spacing:-.02em}.subtitle{margin:0;color:var(--muted)}.variant-pill{background:var(--blue-weak);color:var(--blue);font-weight:700;padding:8px 12px;border-radius:6px;white-space:nowrap}.layout{display:grid;grid-template-columns:232px 1fr;gap:20px}.rail,.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.rail{padding:14px;height:max-content}.rail-title{font-size:12px;color:var(--muted);font-weight:700;margin:3px 10px 12px}.step{display:flex;gap:10px;padding:10px;border-radius:6px;margin:3px 0;color:var(--muted);align-items:flex-start}.step.active{background:var(--blue-weak);color:var(--blue);font-weight:700}.step.done{color:var(--green)}.step-no{width:22px;height:22px;border:1px solid currentColor;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px}.content{min-width:0}.card{padding:22px;margin-bottom:16px}.card h2{font-size:18px;margin:0 0 5px}.card h3{font-size:15px;margin:0 0 10px}.hint{color:var(--muted);margin:0 0 18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.connection{border:1px solid var(--line);border-radius:7px;padding:16px;display:flex;align-items:center;justify-content:space-between;margin:10px 0}.connection.selected{border:2px solid var(--blue);padding:15px;background:#fafbff}.connection strong{display:block}.connection small{color:var(--muted)}.radio{width:18px;height:18px;border:2px solid #b8c2d3;border-radius:50%;display:grid;place-items:center}.selected .radio{border-color:var(--blue)}.selected .radio:after{content:"";width:8px;height:8px;background:var(--blue);border-radius:50%}.btn{border:1px solid #cbd3e2;background:#fff;color:var(--ink);border-radius:6px;padding:8px 14px;font-weight:600}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red);border-color:#eab3b3}.btn.small{padding:5px 9px;font-size:12px}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}.actions-right{display:flex;gap:8px}.form-row{display:flex;gap:10px;align-items:center;margin:9px 0}.form-row label{width:92px;color:var(--muted)}input,select{border:1px solid #cbd3e2;border-radius:6px;padding:9px 10px;background:#fff;color:var(--ink)}input:focus,button:focus,select:focus{outline:3px solid #315efb35;outline-offset:1px}.full{width:100%}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat{border:1px solid var(--line);padding:13px;border-radius:7px}.stat b{font-size:23px;display:block}.stat span{font-size:12px;color:var(--muted)}.stat.safe b{color:var(--green)}.stat.risky b{color:var(--amber)}.stat.blocked b{color:var(--red)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:7px}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:12px 0}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}.table th{background:#fafbfe;color:var(--muted);font-size:12px}.table tr:last-child td{border-bottom:0}.check{width:16px;height:16px;accent-color:var(--blue)}.tag{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 8px;font-size:12px;font-weight:700}.tag.safe,.tag.pass{color:var(--green);background:var(--green-bg)}.tag.risky,.tag.inconclusive{color:var(--amber);background:var(--amber-bg)}.tag.blocked,.tag.fail{color:var(--red);background:var(--red-bg)}.tag.running{color:var(--blue);background:var(--blue-weak)}.tag.neutral{color:var(--muted);background:#eef1f6}.risk{border-left:3px solid var(--amber);background:var(--amber-bg);padding:12px 14px;margin:9px 0;border-radius:4px}.risk.block{border-color:var(--red);background:var(--red-bg)}.risk strong{display:block}.code{background:#1d2638;color:#d7e2fa;padding:15px;border-radius:6px;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto;white-space:pre}.readonly{position:relative}.readonly:after{content:"只读渲染 · 由写入契约生成";position:absolute;right:9px;top:8px;color:#aebbd3;font-size:11px}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.checklist{list-style:none;padding:0;margin:0}.checklist li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}.freeze{display:flex;gap:10px;align-items:flex-start;background:#f6f8fc;border:1px solid var(--line);padding:13px;border-radius:6px}.freeze input{margin-top:4px}.progress{height:7px;background:#e7ebf2;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--blue);border-radius:99px}.progress.compact{width:130px;display:inline-block;vertical-align:middle}.run-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.run-progress{display:flex;align-items:center;gap:13px;margin:17px 0}.run-progress b{font-size:26px}.timeline{border-left:2px solid #dfe5ef;padding-left:18px;margin:16px 0}.event{position:relative;padding:0 0 17px}.event:before{content:"";position:absolute;left:-25px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px var(--blue-weak)}.event small{display:block;color:var(--muted)}.drawer{background:#fbfcff;border:1px solid var(--line);border-radius:7px;padding:16px}.bottom-switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#101a31;color:#fff;border-radius:9px;padding:7px;display:flex;gap:4px;box-shadow:0 10px 30px #101a3155;z-index:5}.bottom-switcher button{background:transparent;color:#aebbd3;border-radius:6px;padding:8px 13px}.bottom-switcher button.active{background:#fff;color:#172033;font-weight:700}.toast{position:fixed;right:25px;top:80px;background:#172033;color:white;padding:11px 15px;border-radius:6px;box-shadow:var(--shadow);display:none;z-index:7}.toast.show{display:block}.notice{padding:11px 13px;border-radius:6px;background:var(--blue-weak);color:#30458d;margin:10px 0}.exception{border:1px solid var(--line);border-radius:7px;padding:13px;margin:9px 0}.exception-head{display:flex;justify-content:space-between;gap:10px}.muted{color:var(--muted)}.section-label{font-size:12px;font-weight:750;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:20px 0 8px}.decision{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:16px;margin:10px 0}.decision strong{display:block;font-size:15px}.decision p{margin:4px 0 0;color:var(--muted)}.icon{font-size:18px;margin-right:5px}.hidden{display:none!important}@media(max-width:820px){.shell{padding:18px 14px 105px}.layout{grid-template-columns:1fr}.rail{display:none}.grid2,.split{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}.topline{display:block}.variant-pill{display:inline-block;margin-top:10px}.appbar{padding:0 14px}.app-actions{gap:7px}.app-actions .user{display:none}.bottom-switcher{width:calc(100% - 24px);justify-content:space-around}.bottom-switcher button{padding:7px 10px}}

<body>
<header class="appbar"><div class="brand"><span class="brand-mark">D</span><span>DBX <span class="prototype-tag">原型 · Issue #21</span></span></div><div class="app-actions"><span>帮助</span><span class="user">王敏 · DBA</span></div></header>
<main class="shell"><div class="topline"><div><div class="eyebrow">migration task / draft</div><h1 class="title">MySQL → PostgreSQL 数据迁移</h1><p class="subtitle">一次性迁移 200 张表 · 源端写入冻结后建立不可变基线</p></div><span class="variant-pill" id="variantPill"></span></div><div id="app"></div></main>
<nav class="bottom-switcher" aria-label="切换原型方案"><button data-variant="A">A · 线性向导</button><button data-variant="B">B · 异常工作台</button><button data-variant="C">C · 三个决策</button></nav><div class="toast" id="toast" role="status"></div>
<script>
const qs=new URLSearchParams(location.search);let variant=(qs.get('variant')||'A').toUpperCase();if(!['A','B','C'].includes(variant))variant='A';
const tables=Array.from({length:200},(_,i)=>({name:['users','orders','order_items','products','audit_log','customer_notes'][i%6]+(i>5?'_'+String(i+1).padStart(3,'0'):''),rows:[12480,892340,2400010,6800,12003450,902][i%6],size:[3.2,128.4,412.8,2.1,890.3,7.4][i%6],kind:i%17===0?'blocked':i%5===0?'risky':'safe',selected:i<196,status:i<12?'done':i<15?'running':'waiting',progress:i<12?100:i<15?[64,41,18][i-12]:0,result:i===4?'fail':i===8?'inconclusive':i<12?'pass':null}));
const state={stage:0,search:'',sort:'rows',freeze:false,details:'orders',live:true,exclusions:4};
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function goStage(n){state.stage=Math.max(0,Math.min(5,n));render()}
function stepRail(){return `<aside class="rail"><div class="rail-title">迁移流程 · ${state.stage+1}/6</div>${['连接与范围','选择表','预检与契约','执行确认','运行监控','验证报告'].map((x,i)=>`<div class="step ${i===state.stage?'active':''} ${i<state.stage?'done':''}"><span class="step-no">${i<state.stage?'✓':i+1}</span><span>${x}</span></div>`).join('')}</aside>`}
function actions(){return `<div class="actions"><button class="btn" onclick="goStage(${state.stage-1})" ${state.stage===0?'disabled':''}>上一步</button><div class="actions-right">${state.stage<5?`<button class="btn primary" onclick="goStage(${state.stage+1})">${state.stage===3?'开始迁移':'继续'}</button>`:`<button class="btn primary" onclick="rerun()">按失败项新建 rerun</button>`}</div></div>`}
function connection(){return `<section class="card"><h2>1. 选择数据库连接</h2><p class="hint">连接是可复用的数据库端点；本次运行会冻结连接语义和凭据版本。</p><div class="grid2"><div class="connection selected" onclick="toast('已选择 MySQL 生产库')"><div><strong>生产 MySQL · orders-prod</strong><small>10.21.8.14:3306 / commerce · TLS 已验证</small></div><span class="radio" aria-label="已选择"></span></div><div class="connection" onclick="toast('打开添加连接表单（原型）')"><div><strong>＋ 添加数据库连接</strong><small>结构化填写主机、端口、TLS 和账号</small></div><span class="muted">›</span></div></div><div class="notice">✓ 最近检查通过 · MySQL 8.0.36 · 字符集 utf8mb4 · 只读账号 dbx_reader</div><div class="section-label">目标</div><div class="grid2"><div class="form-row"><label>PostgreSQL</label><select class="full"><option>分析库 · analytics-prod</option></select></div><div class="form-row"><label>目标 schema</label><input class="full" value="commerce"/></div></div>${actions()}</section>`}
function tableRows(){let a=tables.filter(t=>t.name.toLowerCase().includes(state.search.toLowerCase()));if(state.sort==='size')a.sort((x,y)=>y.size-x.size);return a.slice(0,18).map((t,i)=>`<tr><td><input class="check" type="checkbox" ${t.selected?'checked':''} onchange="toggleTable(${tables.indexOf(t)})" aria-label="选择 ${t.name}"></td><td><strong>${t.name}</strong></td><td>${t.rows.toLocaleString()}</td><td>${t.size} MB</td><td><span class="tag ${t.kind}">${t.kind==='safe'?'安全':t.kind==='risky'?'需确认':'阻断'}</span></td><td><button class="btn small" onclick="openDetails('${t.name}')">查看</button></td></tr>`).join('')}
function selection(){let selected=tables.filter(t=>t.selected).length;return `<section class="card"><h2>2. 选择迁移范围</h2><p class="hint">默认选择 200 张表。明确排除项会留在任务记录中，不会悄悄改变范围。</p><div class="stat-grid"><div class="stat"><b>${selected}</b><span>已选择表</span></div><div class="stat"><b>${tables.filter(t=>t.selected).reduce((s,t)=>s+t.rows,0).toLocaleString()}</b><span>预计行数</span></div><div class="stat risky"><b>${tables.filter(t=>t.selected&&t.kind==='risky').length}</b><span>大记录/风险</span></div><div class="stat blocked"><b>${tables.filter(t=>t.selected&&t.kind==='blocked').length}</b><span>预检阻断</span></div></div><div class="toolbar"><div><button class="btn small" onclick="selectAll(true)">全选 200 张</button> <button class="btn small" onclick="selectAll(false)">清空</button></div><div><input id="search" placeholder="搜索表名" value="${state.search}" oninput="state.search=this.value;render()" aria-label="搜索表名"><button class="btn small" onclick="state.sort=state.sort==='rows'?'size':'rows';render()">按${state.sort==='rows'?'大小':'行数'}排序</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th></th><th>表名</th><th>行数</th><th>数据量</th><th>预检标签</th><th></th></tr></thead><tbody>${tableRows()}</tbody></table></div><p class="muted">当前显示前 18 项 · 仅演示数据。已明确排除 ${state.exclusions} 张表，可在运行范围摘要中恢复。</p>${actions()}</section>`}
function preflight(){return `<section class="card"><h2>3. 预检与写入契约审核</h2><p class="hint">预检必须精确完成；DDL 是只读的“表写入契约”渲染，修改只能通过结构化例外。</p><div class="stat-grid"><div class="stat safe"><b>188</b><span>安全 · 可批准</span></div><div class="stat risky"><b>8</b><span>风险 · 需确认</span></div><div class="stat blocked"><b>4</b><span>阻断 · 不能继续</span></div><div class="stat"><b>200</b><span>总表数</span></div></div><div class="risk block"><strong>阻断 · audit_log_017</strong>最大字段 22,104,320 字节，超过 DBX v1 的 20 MiB 上限。请选择排除此表、裁剪超限字段后重新预检，或中止；不能忽略此限制继续迁移。</div><div class="risk"><strong>需确认 · customer_notes_005</strong>检测到单值超过 1 MiB，将使用大记录隔离 box。支持范围内，但吞吐较低。</div><div class="split"><div><div class="section-label">结构化例外</div><div class="exception"><div class="exception-head"><strong>orders · &lt;code&gt;legacy_status&lt;/code&gt;</strong><span class="tag risky">类型映射</span></div><p class="muted">MySQL ENUM → PostgreSQL text。保持原列名与值域，不允许放宽不变式。</p><button class="btn small" onclick="toast('例外已更新：使用结构化映射（内存）')">编辑结构化例外</button></div><div class="exception"><div class="exception-head"><strong>order_items · &lt;code&gt;discount&lt;/code&gt;</strong><span class="tag safe">自动规则</span></div><p class="muted">DECIMAL(10,2) → numeric(10,2)，无需调整。</p></div></div><div><div class="section-label">生成的 DDL · 只读</div><div class="readonly"><pre class="code">CREATE TABLE commerce.orders (\n  id bigint NOT NULL,\n  legacy_status text NOT NULL,\n  total numeric(12,2),\n  PRIMARY KEY (id)\n);</pre></div><p class="muted">批准后将建表并做结构反查；不提供任意 SQL 编辑器。</p></div></div><div class="actions"><button class="btn" onclick="goStage(1)">返回选择表</button><button class="btn primary" onclick="state.exclusions=4;toast('已排除 4 张阻断表并保存到范围记录');goStage(3)">排除 4 张阻断表并继续</button></div></section>`}
function confirm(){return `<section class="card"><h2>4. 执行确认</h2><p class="hint">确认后将生成不可变 migration run。执行期间需持续保持源端写入冻结。</p><div class="grid2"><div><div class="section-label">本次范围</div><ul class="checklist"><li><span>目标 schema</span><strong>commerce</strong></li><li><span>选中表</span><strong>196 张</strong></li><li><span>排除表</span><strong>${state.exclusions} 张</strong></li><li><span>预计数据</span><strong>1.84 TB</strong></li><li><span>阻断项</span><strong class="tag blocked">4 项必须排除</strong></li></ul></div><div><div class="section-label">写入冻结承诺</div><label class="freeze"><input type="checkbox" ${state.freeze?'checked':''} onchange="state.freeze=this.checked;render()"><span><strong>我确认源端 commerce 在基线捕获至验证结束前停止写入</strong><br><span class="muted">负责人：王敏 · 变更单：CHG-2026-0812 · 到期：今天 23:00（可延长）</span></span></label><div class="notice">运行会保存来源基线、连接凭据版本、契约和 scope。取消不会删除 topic 或目标数据。</div></div></div><div class="actions"><button class="btn" onclick="goStage(2)">返回审核</button><button class="btn primary" onclick="state.freeze=true;goStage(4)">确认并进入监控</button></div></section>`}
function monitoring(){let done=tables.filter(t=>t.status==='done').length;return `<section class="card"><div class="run-head"><div><h2>5. 运行监控 · RUN-2026-0812-014</h2><p class="hint">滚动 admission · 只读观察，不把 connector 分组当作表结果</p></div><span class="tag running"><span class="icon">●</span>RUNNING</span></div><div class="run-progress"><b>${done}/196</b><div class="full"><div class="progress"><i style="width:${Math.round(done/196*100)}%"></i></div><small class="muted">表迁移完成 · 最后更新 14:32:08 · 仍有 3 个 box 运行中</small></div></div><div class="toolbar"><strong>表级状态</strong><div><button class="btn small" onclick="state.live=!state.live;toast(state.live?'已开启模拟实时更新':'已暂停实时更新')">${state.live?'实时更新：开':'实时更新：关'}</button> <button class="btn small" onclick="openDetails('orders')">查看表时间线</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>表</th><th>阶段</th><th>进度</th><th>结果</th><th>更新时间</th></tr></thead><tbody>${tables.slice(0,12).map((t,i)=>`<tr><td><strong>${t.name}</strong></td><td>${t.status==='done'?'VALIDATING':t.status==='running'?'TRANSFERRING':'WAITING_FOR_BOX'}</td><td><span class="progress compact"><i style="width:${t.progress}%"></i></span> ${t.progress}%</td><td><span class="tag ${t.result==='fail'?'fail':t.result==='inconclusive'?'inconclusive':t.status==='done'?'pass':'neutral'}"><span class="icon">${t.result==='fail'?'!':t.result==='inconclusive'?'?':t.status==='done'?'✓':'·'}</span>${t.result==='fail'?'FAIL':t.result==='inconclusive'?'INCONCLUSIVE':t.status==='done'?'PASS':'等待'}</span></td><td class="muted">14:3${i}</td></tr>`).join('')}</tbody></table></div><div id="detail" class="drawer" style="margin-top:16px"><strong>orders · 表时间线</strong><div class="timeline"><div class="event"><strong>14:28 · 写入完成</strong><small>基线 892,340 行 · target count 一致</small></div><div class="event"><strong>14:31 · 验证开始</strong><small>行数、主键范围、抽样校验</small></div><div class="event"><strong>14:32 · 正在确认</strong><small>结果尚未终态；状态保持透明</small></div></div><button class="btn small" onclick="rerun()">失败/不确定项新建 rerun</button></div><div class="actions"><button class="btn" onclick="goStage(3)">返回执行确认</button><button class="btn primary" onclick="goStage(5)">查看验证报告</button></div></section>`}
function report(){return `<section class="card"><h2>6. 验证报告</h2><p class="hint">技术结果与操作员的 validation disposition 分开记录；接受风险不会把 FAIL 改成 PASS。</p><div class="stat-grid"><div class="stat safe"><b>187</b><span>PASS · 技术结果</span></div><div class="stat blocked"><b>3</b><span>FAIL · 技术结果</span></div><div class="stat risky"><b>2</b><span>INCONCLUSIVE</span></div><div class="stat"><b>2</b><span>已接受风险</span></div></div><div class="risk block"><strong>FAIL · audit_log_017</strong>源表超出 20 MiB 支持上限，结果不可被接受风险覆盖。建议排除此表后按新 run 重做。</div><div class="exception"><div class="exception-head"><strong>INCONCLUSIVE · customer_notes_005</strong><span class="tag inconclusive">技术结果未定</span></div><p class="muted">预检超时，未能证明 envelope。修复权限/超时后新建 run；不能在本次运行内重试。</p><button class="btn small" onclick="toast('已记录接受风险 disposition（不改变 INCONCLUSIVE）')">记录接受风险理由</button></div><div class="notice"><strong>运行结论：COMPLETED_WITH_ACCEPTED_RISK</strong><br>187 张表技术通过；2 项保留 INCONCLUSIVE 并由王敏记录了风险理由；3 项 FAIL 仍需新 run。</div><div class="actions"><button class="btn" onclick="openDetails('audit_log_017')">打开诊断包</button><button class="btn primary" onclick="rerun()">按失败项新建 rerun</button></div></section>`}
function variantA(){let body=[connection,selection,preflight,confirm,monitoring,report][state.stage]();return stepRail()+`<div class="content">${body}</div>`}
function variantB(){return `<div class="layout"><aside class="rail"><div class="rail-title">运行总览</div><div class="stat safe"><b>188</b><span>可安全执行</span></div><div class="stat risky"><b>8</b><span>待处理风险</span></div><div class="stat blocked"><b>4</b><span>已阻断</span></div><div class="section-label">例外优先</div>${['audit_log_017','customer_notes_005','orders.legacy_status'].map(x=>`<div class="step ${state.details===x?'active':''}" onclick="openDetails('${x}')"><span class="step-no">!</span><span>${x}<small class="muted">需要 DBA 决定</small></span></div>`).join('')}<div class="section-label">阶段</div>${['连接','范围','契约','确认','监控','报告'].map((x,i)=>`<div class="step ${i===state.stage?'active':''}" onclick="goStage(${i})"><span class="step-no">${i+1}</span><span>${x}</span></div>`).join('')}</aside><div class="content"><section class="card"><div class="run-head"><div><div class="eyebrow">B · exception-first workbench</div><h2>先处理会阻断运行的事</h2><p class="hint">左侧是当前必须做决定的例外；普通表可以稍后批量确认。</p></div><span class="tag risky">ATTENTION_REQUIRED</span></div><div class="decision"><div><strong>① 处理 4 个阻断项</strong><p>unsupported / inconclusive 不允许被忽略</p></div><button class="btn primary" onclick="openDetails('audit_log_017')">查看</button></div><div class="decision"><div><strong>② 确认 8 个可控风险</strong><p>大记录表将被隔离到独立 box</p></div><button class="btn" onclick="openDetails('customer_notes_005')">查看</button></div><div class="decision"><div><strong>③ 连接、范围和冻结</strong><p>剩余 188 张普通表可一次确认</p></div><button class="btn" onclick="goStage(0)">查看</button></div></section><section class="card" id="workbenchDetail">${preflight().replace('<section class="card">','').replace('</section>','')}</section></div></div>`}
function variantC(){return `<div class="content"><section class="card"><div class="eyebrow">C · goal-oriented journey</div><h2>把迁移变成三个决定</h2><p class="hint">你不需要理解 box、topic 或 connector；只需确认范围、风险和执行责任。</p><div class="decision"><div><strong><span class="icon">①</span>我要迁移哪些数据？</strong><p>orders-prod → analytics-prod / commerce · 196/200 张表</p></div><button class="btn primary" onclick="goStage(1)">确认范围</button></div><div class="decision"><div><strong><span class="icon">②</span>有哪些地方需要我承担风险？</strong><p><span class="tag blocked">4 阻断</span> <span class="tag risky">8 需确认</span> · 先看异常，再看 DDL</p></div><button class="btn" onclick="goStage(2)">审阅风险</button></div><div class="decision"><div><strong><span class="icon">③</span>什么时候可以安全开始？</strong><p>需要写入冻结 · 预计 1.84 TB · 完成后给出逐表验证报告</p></div><button class="btn" onclick="goStage(3)">确认并开始</button></div></section><div class="grid2"><section class="card"><h3>当前决定摘要</h3><ul class="checklist"><li><span>源端连接</span><span class="tag pass">已验证</span></li><li><span>结构化例外</span><span class="tag risky">1 项</span></li><li><span>DDL</span><span class="tag neutral">只读</span></li><li><span>写入冻结</span><span class="tag ${state.freeze?'pass':'risky'}">${state.freeze?'已确认':'待确认'}</span></li></ul></section><section class="card"><h3>运行后你会看到</h3><p class="muted">每张表都有阶段、进度、技术验证结果和时间线。FAIL / INCONCLUSIVE 与“接受风险”分开显示。</p><button class="btn small" onclick="goStage(4)">预览监控</button></section></div></div>`}
function openDetails(name){state.details=name;toast('已打开 '+name+' 的详情');if(variant==='B')render()}
function toggleTable(i){tables[i].selected=!tables[i].selected;render()};function selectAll(v){tables.forEach(t=>t.selected=v);state.exclusions=v?0:200;toast(v?'已选择 200 张表':'已清空选择');render()};function rerun(){toast('已创建新的 rerun 草稿（内存）');state.stage=1;render()}
function render(){document.getElementById('variantPill').textContent=`方案 ${variant} · ${variant==='A'?'线性向导':variant==='B'?'异常工作台':'三个决定'}`;document.querySelectorAll('[data-variant]').forEach(b=>b.classList.toggle('active',b.dataset.variant===variant));document.getElementById('app').innerHTML=variant==='A'?`<div class="layout">${variantA()}</div>`:variant==='B'?variantB():variantC()}
document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;history.replaceState(null,'',`?variant=${variant}`);state.stage=0;render()});document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(e.key==='ArrowRight')goStage(state.stage+1);if(e.key==='ArrowLeft')goStage(state.stage-1)});render();
</script>
