const tables=[

{id:'orders',name:'orders',selected:true,excluded:false,rows:892340,size:128.4,condition:'review',reason:'1 个字段需要结构化例外',phase:'validating',progress:92,result:'inconclusive',updated:'14:32',fields:[['id','BIGINT','bigint','否','—','auto'],['legacy_status','ENUM','text','否','—','exception'],['total','DECIMAL(12,2)','numeric(12,2)','是','NULL','auto']],checks:['字段与行大小均在支持范围内','ENUM 值域检查通过','目标端不存在同名表'],ddl:'CREATE TABLE "commerce"."orders" (\n  "id" bigint NOT NULL,\n  "legacy_status" text NOT NULL,\n  "total" numeric(12,2),\n  PRIMARY KEY ("id")\n);'},
{id:'order_items',name:'order_items',selected:true,excluded:false,rows:2400010,size:412.8,condition:'safe',reason:'自动映射，预检通过',phase:'transferring',progress:64,result:'fail',updated:'14:32',fields:[['id','BIGINT','bigint','否','—','auto'],['order_id','BIGINT','bigint','否','—','auto'],['quantity','INT','integer','否','1','auto'],['unit_price','DECIMAL(12,2)','numeric(12,2)','否','—','auto']],checks:['字段与行大小均在支持范围内','数值范围检查通过','目标端不存在同名表'],ddl:'CREATE TABLE "commerce"."order_items" (\n  "id" bigint NOT NULL,\n  "order_id" bigint NOT NULL,\n  "quantity" integer NOT NULL DEFAULT 1,\n  "unit_price" numeric(12,2) NOT NULL,\n  PRIMARY KEY ("id")\n);'},

];
const state={stage:0,maxStage:0,sourceDatabase:'commerce',targetSchema:'commerce',search:'',sort:'name',freeze:false,activeTableId:'orders',tableTab:'mapping',live:true,runId:'RUN-2026-0812-014'};
const steps=['连接与数据库','迁移范围','逐表配置','执行确认','运行监控','验证报告'];
function toast(text){const node=document.getElementById('toast');node.textContent=text;node.classList.add('show');setTimeout(()=>node.classList.remove('show'),2200)}
function includedTables(){return tables.filter(t=>t.selected&&!t.excluded)}
function excludedTables(){return tables.filter(t=>t.excluded)}
function activeTable(){return tables.find(t=>t.id===state.activeTableId)||tables[0]}
function conditionMeta(table){if(table.excluded)return ['neutral','已排除','不参与本次迁移和验证'];if(table.condition==='blocked')return ['blocked','阻断',table.reason];if(table.condition==='review')return ['risky','需要确认',table.reason];return ['safe','可迁移',table.reason]}
function preflightMeta(table){if(table.excluded)return ['neutral','已排除'];if(table.condition==='blocked')return ['blocked','不支持'];return ['safe','通过']}
function phaseLabel(phase){return {terminal:'已完成',validating:'验证中',transferring:'传输中',waiting:'等待执行',creating:'创建目标表',discovered:'等待处理'}[phase]||'准备中'}
function resultMeta(result){return result==='pass'?['pass','PASS · 通过']:result==='fail'?['fail','FAIL · 失败']:result==='inconclusive'?['inconclusive','INCONCLUSIVE · 无法确定']:['neutral','等待结果']}
function canConfigure(){return includedTables().length>0}
function unresolvedTables(){return includedTables().filter(t=>t.condition==='blocked')}
function canConfirm(){return includedTables().length>0&&unresolvedTables().length===0}
function goStage(stage){if(stage>state.maxStage&&stage!==state.stage+1)return;if(stage===2&&!canConfigure()){toast('请先选择至少一张表');return}if(stage===3&&!canConfirm()){toast('请先处理或排除阻断表');return}if(stage===4&&!state.freeze){toast('开始前必须确认源端写冻结');return}state.stage=Math.max(0,Math.min(5,stage));state.maxStage=Math.max(state.maxStage,state.stage);render()}
function horizontalStepper(){return `<div class="stepper" aria-label="创建迁移步骤">${steps.map((label,index)=>`${index?'<i></i>':''}<button class="${index===state.stage?'active':index<state.stage?'done':''}" ${index>state.maxStage?'disabled':''} onclick="goStage(${index})"><span class="step-no">${index<state.stage?'✓':index+1}</span>${label}</button>`).join('')}</div>`}
function backButton(target){return target<0?'':`<button class="btn" onclick="goStage(${target})">上一步</button>`}
function connection(){return `<section class="card"><h2>1. 选择数据库连接和源库</h2><p class="hint">连接在「数据源」中单独维护。向导只选择已验证的连接、源数据库和目标 schema，不保存新凭据。</p><div class="grid2"><div><div class="section-label">源端</div><div class="connection selected"><div><strong>生产 MySQL · orders-prod</strong><small>10.21.8.14:3306 · TLS 已验证 · 只读账号</small></div><span class="radio" aria-label="已选择"></span></div><div class="form-row"><label>源数据库</label><select class="full" onchange="selectDatabase(this.value)">${sourceDatabases.map(db=>`<option ${db===state.sourceDatabase?'selected':''}>${db}</option>`).join('')}</select></div><div class="notice">最近检查通过 · MySQL 8.0.36 · utf8mb4 · 权限满足预检要求</div></div><div><div class="section-label">目标端</div><div class="connection selected"><div><strong>分析 PostgreSQL · analytics-prod</strong><small>10.21.8.21:5432 / analytics · TLS 已验证</small></div><span class="radio" aria-label="已选择"></span></div><div class="form-row"><label>目标 schema</label><input class="full" value="${state.targetSchema}" oninput="state.targetSchema=this.value" aria-label="目标 schema"></div><div class="notice">目标能力检查使用隔离对象，不会写入业务表。</div></div></div><div class="toolbar"><a href="#" onclick="event.preventDefault();toast('请在数据源管理中添加或轮换连接')">前往数据源管理 →</a><span class="muted">${state.sourceDatabase} → analytics / ${state.targetSchema}</span></div><div class="actions"><span class="muted">下一步将从 ${state.sourceDatabase} 选择迁移表</span><button class="btn primary" onclick="goStage(1)">下一步：选择表</button></div></section>`}
function tableRows(){let visible=tables.filter(t=>t.name.toLowerCase().includes(state.search.toLowerCase()));if(state.sort==='size')visible.sort((a,b)=>b.size-a.size);else visible.sort((a,b)=>a.name.localeCompare(b.name));return visible.map(t=>{const meta=conditionMeta(t);return `<tr><td><input class="check" type="checkbox" ${t.selected&&!t.excluded?'checked':''} ${t.excluded?'disabled':''} onchange="toggleTable('${t.id}')" aria-label="选择 ${t.name}"></td><td><strong>${t.name}</strong><small>${state.sourceDatabase}.${t.name}</small></td><td>${t.rows.toLocaleString()}</td><td>${t.size} MB</td><td><span class="tag ${meta[0]}">${meta[1]}</span><small>${meta[2]}</small></td><td><button class="btn small" onclick="openTable('${t.id}',true)">配置</button> ${t.excluded?`<button class="btn small" onclick="restoreTable('${t.id}')">恢复</button>`:`<button class="btn small danger" onclick="excludeTable('${t.id}')">排除</button>`}</td></tr>`}).join('')}
function selection(){const selected=includedTables();return `<section class="card"><h2>2. 选择迁移表</h2><p class="hint">从源库中明确选择本次范围。每张表都显示当前情况，并可进入独立配置空间；不使用正则表达式。</p><div class="split"><div class="drawer"><div class="section-label">源端对象</div><div class="form-row"><label>数据库</label><select class="full" onchange="selectDatabase(this.value)">${sourceDatabases.map(db=>`<option ${db===state.sourceDatabase?'selected':''}>${db}</option>`).join('')}</select></div><div style="padding:8px 0">▾ <strong>${state.sourceDatabase}</strong></div>${tables.map(t=>{const m=conditionMeta(t);return `<div style="padding:5px 0 5px 18px">${t.excluded?'☐':t.selected?'☑':'☐'} ${t.name} <span class="tag ${m[0]}">${m[1]}</span></div>`}).join('')}<div class="notice">已选择 <strong>${selected.length}</strong> 张 · 已排除 <strong>${excludedTables().length}</strong> 张</div></div><div><div class="stat-grid"><div class="stat"><b>${selected.length}</b><span>已选择</span></div><div class="stat risky"><b>${selected.filter(t=>t.condition==='review').length}</b><span>需要确认</span></div><div class="stat blocked"><b>${unresolvedTables().length}</b><span>存在阻断</span></div><div class="stat"><b>${excludedTables().length}</b><span>明确排除</span></div></div><div class="toolbar"><input placeholder="搜索表名" value="${state.search}" oninput="state.search=this.value;render()" aria-label="搜索表名"><div><button class="btn small" onclick="selectAll()">选择全部可迁移表</button> <button class="btn small" onclick="state.sort=state.sort==='name'?'size':'name';render()">按${state.sort==='name'?'数据量':'名称'}排序</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>选择</th><th>表名</th><th>行数</th><th>数据量</th><th>当前情况</th><th>操作</th></tr></thead><tbody>${tableRows()}</tbody></table></div></div></div><div class="actions">${backButton(0)}<div class="actions-right"><button class="btn primary" ${canConfigure()?'':'disabled'} onclick="goStage(2)">下一步：逐表配置</button></div></div></section>`}
function tablePicker(){return `<div class="table-picker"><div class="section-label" style="margin:4px 3px 9px">本次范围 · ${includedTables().length} 张表</div>${tables.map(t=>{const c=conditionMeta(t),p=preflightMeta(t);return `<button class="table-choice ${t.id===state.activeTableId?'active':''}" onclick="openTable('${t.id}')"><span class="table-choice-head"><strong>${t.name}</strong><span class="tag ${c[0]}">${c[1]}</span></span><small>预检：${p[1]}${t.fields.some(f=>f[5]==='exception')?' · 1 个结构化例外':''}</small></button>`}).join('')}</div>`}
function mappingPanel(table){return `<div class="table-wrap"><table class="table"><thead><tr><th>源字段</th><th>源类型</th><th>目标类型</th><th>可空</th><th>默认值</th><th>映射方式</th></tr></thead><tbody>${table.fields.map(field=>`<tr><td><strong>${field[0]}</strong></td><td>${field[1]}</td><td>${field[5]==='exception'?`<select onchange="saveException('${table.id}')"><option>${field[2]}</option><option>varchar(64)</option></select>`:field[2]}</td><td>${field[3]}</td><td>${field[4]}</td><td><span class="tag ${field[5]==='exception'?'risky':field[5]==='blocked'?'blocked':'safe'}">${field[5]==='exception'?'结构化例外':field[5]==='blocked'?'需要处理':'自动'}</span></td></tr>`).join('')}</tbody></table></div>${table.fields.some(f=>f[5]==='exception')?`<div class="exception"><div class="exception-head"><strong>legacy_status · 值域保持</strong><button class="btn small" onclick="saveException('${table.id}')">保存例外</button></div><p class="muted">ENUM → text；保留原值域与精度，转换不满足约束时阻断。只允许受控选项，不支持自由 SQL 或表达式。</p></div>`:`<div class="notice">字段均使用自动映射，无需逐项配置。只有例外字段才需要 DBA 处理。</div>`}`}
function preflightPanel(table){const meta=preflightMeta(table);return `<div class="run-head"><div><h3>精确预检</h3><p class="hint">每张纳入表都必须完成预检，无法确定或不支持时不能忽略继续。</p></div><span class="tag ${meta[0]}">${meta[1]}</span></div>${table.condition==='blocked'&&!table.excluded?`<div class="risk block"><strong>无法迁移：表 audit_log 的 payload 最大为 22,104,320 字节，超过 DBX v1 的 20 MiB（20,971,520 字节）上限。</strong>请选择排除此表、裁剪超限字段后重新预检，或中止并在源端缩减数据；不能忽略此限制继续迁移。</div>`:''}<ul class="checklist">${table.checks.map((check,index)=>`<li><span>${check}</span><span class="tag ${table.condition==='blocked'&&index===0?'blocked':'safe'}">${table.condition==='blocked'&&index===0?'不通过':'通过'}</span></li>`).join('')}</ul>${table.condition==='blocked'&&!table.excluded?`<div class="actions"><button class="btn" onclick="toast('裁剪字段后必须针对剩余字段重新预检')">裁剪字段并重新预检</button><button class="btn danger" onclick="excludeTable('${table.id}')">排除该表</button></div>`:''}${table.excluded?`<div class="notice">该表已明确排除，不会进入迁移运行或验证结果。</div>`:''}`}
function contractPanel(table){return `<div class="notice">完整 DDL 由已审核字段映射和表写入契约生成。平台执行后还会反查 PostgreSQL 结构；只有零差异才开始传输。</div><div class="readonly"><pre class="code">${table.ddl.split('\n').map((line,index)=>String(index+1).padStart(2,'0')+'  '+line).join('\n')}</pre></div><p class="muted">不可直接编辑 SQL。若需改变结构，请返回字段映射并添加受控的结构化例外。</p>`}
function preflight(){const table=activeTable();const tabs=[['mapping','字段映射'],['preflight','预检情况'],['contract','写入契约']];const panel=state.tableTab==='mapping'?mappingPanel(table):state.tableTab==='preflight'?preflightPanel(table):contractPanel(table);const unresolved=unresolvedTables();return `<section class="card"><h2>3. 逐表配置与预检</h2><p class="hint">自动映射是默认值。逐表确认例外、预检证据和只读写入契约，重点处理需要 DBA 决定的地方。</p><div class="stat-grid"><div class="stat"><b>${includedTables().length}</b><span>本次纳入</span></div><div class="stat safe"><b>${includedTables().filter(t=>t.condition!=='blocked').length}</b><span>预检通过</span></div><div class="stat risky"><b>${includedTables().filter(t=>t.condition==='review').length}</b><span>结构化例外</span></div><div class="stat blocked"><b>${unresolved.length}</b><span>未解决阻断</span></div></div><div class="config-layout">${tablePicker()}<div class="drawer"><div class="run-head"><div><div class="section-label" style="margin:0">当前表</div><h2>${table.name}</h2><p class="hint">${conditionMeta(table)[2]}</p></div><span class="tag ${conditionMeta(table)[0]}">${conditionMeta(table)[1]}</span></div><div class="tabs">${tabs.map(tab=>`<button class="${state.tableTab===tab[0]?'active':''}" onclick="showTab('${tab[0]}')">${tab[1]}</button>`).join('')}</div>${panel}</div></div>${unresolved.length?`<div class="risk block"><strong>还不能进入执行确认</strong>${unresolved.map(t=>t.name).join('、')} 仍有不可绕过的预检阻断。请修正后重新预检，或明确排除。</div>`:`<div class="notice">所有纳入表均已完成预检并生成写入契约，可以进入执行确认。</div>`}<div class="actions">${backButton(1)}<button class="btn primary" ${canConfirm()?'':'disabled'} onclick="goStage(3)">下一步：执行确认</button></div></section>`}
function confirm(){const selected=includedTables(),excluded=excludedTables();return `<section class="card"><h2>4. 执行前确认</h2><p class="hint">确认后创建不可变迁移运行。连接版本、来源基线、表写入契约和本次范围都会被记录。</p><div class="grid2"><div><div class="section-label">本次范围</div><ul class="checklist"><li><span>源端</span><strong>orders-prod / ${state.sourceDatabase}</strong></li><li><span>目标端</span><strong>analytics-prod / ${state.targetSchema}</strong></li><li><span>纳入表</span><strong>${selected.map(t=>t.name).join('、')}</strong></li><li><span>明确排除</span><strong>${excluded.length?excluded.map(t=>t.name).join('、'):'无'}</strong></li><li><span>预计数据量</span><strong>${selected.reduce((sum,t)=>sum+t.size,0).toFixed(1)} MB</strong></li></ul></div><div><div class="section-label">源端写冻结承诺</div><label class="freeze"><input type="checkbox" ${state.freeze?'checked':''} onchange="state.freeze=this.checked;render()"><span><strong>我确认 ${state.sourceDatabase} 从基线捕获到验证结束前停止写入</strong><br><span class="muted">负责人：王敏 · 变更单：CHG-2026-0812 · 到期：今天 23:00</span></span></label><div class="notice">DBX 记录承诺但不控制源端写入。若发现来源变化，结果将标记为“无法确定”，不会误报为迁移失败。</div></div></div><div class="actions"><button class="btn" onclick="goStage(2)">返回逐表配置</button><button class="btn primary" ${state.freeze?'':'disabled'} onclick="goStage(4)">确认并开始迁移</button></div></section>`}
function monitoringRows(){return includedTables().map(t=>{const result=resultMeta(t.result);return `<tr><td><strong>${t.name}</strong><small>表迁移单元</small></td><td>${phaseLabel(t.phase)}</td><td><span class="progress compact"><i style="width:${t.progress}%"></i></span> ${t.progress}%</td><td><span class="tag ${result[0]}">${result[1]}</span></td><td class="muted">${t.updated}</td><td><button class="btn small" onclick="openTimeline('${t.id}')">查看时间线</button></td></tr>`}).join('')}
function monitoring(){const selected=includedTables(),complete=selected.filter(t=>t.phase==='terminal').length;return `<section class="card"><div class="run-head"><div><h2>5. 运行监控 · ${state.runId}</h2><p class="hint">每张表独立展示阶段、进度、技术结果和时间线；平台调度细节不影响表级结果。</p></div><span class="tag running"><span class="icon">●</span>运行中</span></div><div class="run-progress"><b>${complete}/${selected.length}</b><div class="full"><div class="progress"><i style="width:${Math.round(complete/selected.length*100)}%"></i></div><small class="muted">表迁移完成 · 最后更新 14:32:08</small></div></div><div class="toolbar"><strong>逐表情况</strong><button class="btn small" onclick="state.live=!state.live;toast(state.live?'已开启模拟实时更新':'已暂停实时更新')">实时更新：${state.live?'开':'关'}</button></div><div class="table-wrap"><table class="table"><thead><tr><th>表</th><th>当前阶段</th><th>进度</th><th>技术结果</th><th>更新时间</th><th></th></tr></thead><tbody>${monitoringRows()}</tbody></table></div><div id="detail" class="drawer" style="margin-top:16px"><strong>${activeTable().name} · 表时间线</strong><div class="timeline"><div class="event"><strong>14:28 · 表写入完成</strong><small>来源基线 ${activeTable().rows.toLocaleString()} 行 · 目标行数一致</small></div><div class="event"><strong>14:31 · 迁移校验开始</strong><small>行数、主键范围、数值聚合与抽样校验</small></div><div class="event"><strong>14:32 · ${phaseLabel(activeTable().phase)}</strong><small>所有状态和证据按表保留，不以平台内部资源代替表结果。</small></div></div></div><div class="actions"><button class="btn" onclick="goStage(3)">返回执行确认</button><button class="btn primary" onclick="goStage(5)">查看验证报告</button></div></section>`}
function report(){const selected=includedTables(),pass=selected.filter(t=>t.result==='pass').length,fail=selected.filter(t=>t.result==='fail').length,uncertain=selected.filter(t=>t.result==='inconclusive').length,accepted=selected.filter(t=>t.acceptedRisk).length;return `<section class="card"><h2>6. 验证报告</h2><p class="hint">技术验证结果、预检排除和操作员接受风险分别记录。接受风险不会把失败或无法确定改写为通过。</p><div class="stat-grid"><div class="stat safe"><b>${pass}</b><span>PASS · 通过</span></div><div class="stat blocked"><b>${fail}</b><span>FAIL · 失败</span></div><div class="stat risky"><b>${uncertain}</b><span>INCONCLUSIVE · 无法确定</span></div><div class="stat"><b>${excludedTables().length}</b><span>预检已排除</span></div></div><div class="table-wrap"><table class="table"><thead><tr><th>表</th><th>技术结果</th><th>校验覆盖</th><th>接受风险</th><th>后续操作</th></tr></thead><tbody>${selected.map(t=>{const r=resultMeta(t.result);return `<tr><td><strong>${t.name}</strong></td><td><span class="tag ${r[0]}">${r[1]}</span></td><td>${t.result==='pass'?'聚合 + 抽样 1000 行':t.result==='fail'?'行数与聚合检查':'聚合检查未形成结论'}</td><td>${t.acceptedRisk?'<span class="tag risky">已记录</span>':'—'}</td><td>${t.result==='fail'||t.result==='inconclusive'?`<button class="btn small" onclick="acceptRisk('${t.id}')">记录接受风险</button>`:'无需处理'}</td></tr>`}).join('')}</tbody></table></div>${excludedTables().length?`<div class="notice"><strong>预检已排除：</strong>${excludedTables().map(t=>t.name).join('、')} 未执行迁移，不计入技术验证结果。</div>`:''}<div class="risk ${fail?'block':''}"><strong>${fail?'运行结论：存在失败':'运行结论：等待处置'}</strong>${pass} 张表通过；${fail} 张失败；${uncertain} 张无法确定；${accepted} 张已记录接受风险。绿色仅表示“所有已启用的 v1 校验通过”，不表示全部数据逐行一致。</div><div class="actions"><button class="btn" onclick="goStage(4)">返回运行监控</button><button class="btn primary" onclick="rerun()">按失败/无法确定项新建迁移运行</button></div></section>`}
function variantA(){const body=[connection,selection,preflight,confirm,monitoring,report][state.stage]();return `<div class="content">${horizontalStepper()}${body}</div>`}
function variantB(){return `<div class="layout with-rail"><aside class="rail"><div class="rail-title">早期对照方案</div>${tables.map(t=>{const m=conditionMeta(t);return `<button class="step ${state.activeTableId===t.id?'active':''}" onclick="openTable('${t.id}')"><span class="step-no">!</span><span>${t.name}<small class="muted">${m[1]}</small></span></button>`}).join('')}</aside><div class="content"><section class="card"><div class="eyebrow">B · 异常优先工作台</div><h2>先处理需要决定的异常</h2><p class="hint">这是保留用于比较的早期方案。当前设计工作集中在 Variant A。</p>${tables.filter(t=>t.condition!=='safe').map(t=>`<div class="decision"><div><strong>${t.name}</strong><p>${t.reason}</p></div><button class="btn" onclick="openTable('${t.id}')">查看</button></div>`).join('')}</section></div></div>`}
function variantC(){return `<div class="content"><section class="card"><div class="eyebrow">C · 三个决策</div><h2>把迁移压缩成三个决定</h2><p class="hint">这是保留用于比较的早期方案。当前设计工作集中在 Variant A。</p><div class="decision"><div><strong>① 迁移哪些数据？</strong><p>orders-prod / ${state.sourceDatabase} → analytics-prod / ${state.targetSchema} · ${includedTables().length} 张表</p></div></div><div class="decision"><div><strong>② 哪些地方需要承担风险？</strong><p>${unresolvedTables().length} 个阻断 · ${includedTables().filter(t=>t.condition==='review').length} 个需要确认</p></div></div><div class="decision"><div><strong>③ 什么时候可以安全开始？</strong><p>逐表预检、审核只读写入契约并确认源端写冻结</p></div></div></section></div>`}
function selectDatabase(value){state.sourceDatabase=value;state.targetSchema=value;toast('已选择源数据库 '+value);render()}
function toggleTable(id){const table=tables.find(t=>t.id===id);table.selected=!table.selected;render()}
function selectAll(){tables.forEach(t=>{if(t.condition!=='blocked'){t.selected=true;t.excluded=false}});toast('已选择全部可迁移表');render()}
function openTable(id,advance=false){state.activeTableId=id;state.tableTab='mapping';if(advance){state.maxStage=Math.max(state.maxStage,2);state.stage=2}render()}
function showTab(tab){state.tableTab=tab;render()}
function excludeTable(id){const table=tables.find(t=>t.id===id);table.excluded=true;table.selected=false;toast('已明确排除 '+table.name+'；不会计入迁移或验证失败');render()}
function restoreTable(id){const table=tables.find(t=>t.id===id);table.excluded=false;table.selected=true;toast('已恢复 '+table.name+'，需要重新确认预检');render()}
function saveException(id){toast(tables.find(t=>t.id===id).name+' 的结构化例外已保存（仅内存）')}
function openTimeline(id){state.activeTableId=id;toast('已打开 '+activeTable().name+' 的表时间线');render()}
function acceptRisk(id){const table=tables.find(t=>t.id===id);table.acceptedRisk=true;toast('已记录 '+table.name+' 的接受风险理由；技术结果未改变');render()}
function rerun(){const eligible=tables.filter(t=>t.result==='fail'||t.result==='inconclusive');tables.forEach(t=>{t.selected=eligible.includes(t);if(eligible.includes(t)){t.excluded=false;t.phase='discovered';t.progress=0;t.result=null}});state.stage=1;state.maxStage=1;state.freeze=false;state.runId='新迁移运行草稿';toast('已新建迁移运行草稿；将重新预检并获取新基线');render()}
function render(){document.getElementById('variantPill').textContent=`方案 ${variant} · ${variant==='A'?'线性向导':variant==='B'?'异常工作台':'三个决策'}`;document.querySelectorAll('[data-variant]').forEach(button=>button.classList.toggle('active',button.dataset.variant===variant));document.getElementById('app').innerHTML=variant==='A'?`<div class="layout">${variantA()}</div>`:variant==='B'?variantB():variantC()}
document.querySelectorAll('[data-variant]').forEach(button=>button.onclick=()=>{variant=button.dataset.variant;history.replaceState(null,'',`?variant=${variant}`);render()});render();
</script>
</body>
</html>
