# The rungs of ADR-0022 that CI owns.
#
# L1 (`check`) on every pull request and every push to main; L2 (`seamTest`) alongside it; L3
# (`e2eTest`) on merge into main. All three run on a GitHub-hosted `ubuntu-latest` runner, which
# #108 chose over a self-hosted runner on the maintainer's mac: this repository is public, and a
# self-hosted runner on a public repository executes a fork's pull request on that hardware.
# ADR-0022 §Where it runs records the ruling. L4 (`packageTest`) is deliberately absent — ADR-0035
# puts it on the mac before a release tag, against the real package.
name: backend

on:
  push:
    branches: [main]
  pull_request:
  # L3's runner has to be able to stand up the five pinned services of the #9 test bed. Until the
  # first e2e test lands, nothing exercises that, and an unexercised claim about a runner is the
  # kind that fails the day it first matters. This trigger starts the bed on demand so the claim
  # can be proved now and re-proved whenever the bed or the runner image changes.
  workflow_dispatch:
    inputs:
      start_test_bed:
        description: "Start the #9 test bed even if L3 has no tests yet (proves the runner can host it)"
        type: boolean
        default: false

# A second push to a branch makes the first run's verdict worthless, and L3 pulls a 6 GB test bed.
# `main` is exempt: its runs are the post-merge gate and each one judges a different commit.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: backend

jobs:
  # --- L1 -----------------------------------------------------------------------------------
  verify:
    name: L1 check
    runs-on: ubuntu-latest
    env:
      # The commit range the Golden-Update trailer gate judges (ADR-0022 §Explicit updates). Without
      # it the gate skips, so CI is where the gate actually bites; a first push to a branch reports
      # an all-zero start, which the gate reads as "no range" rather than as a failure.
      GOLDEN_RANGE: >-
        ${{ github.event_name == 'pull_request'
            && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
            || format('{0}..{1}', github.event.before, github.sha) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate needs both ends of the range and the diff between them; the default shallow
          # checkout has neither.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check

  # --- L2 -----------------------------------------------------------------------------------
  #
  # Independent of L1 rather than needing it: the two fail for different reasons, and an agent
  # reading a red run wants both verdicts, not the cheaper one masking the other.
  #
  # No Docker setup step. Testcontainers pulls the engines it names on a runner where the daemon is
  # already up; `ubuntu-latest` runs containers natively, without the virtual machine that Docker
  # Desktop imposes on the mac.
  seam:
    name: L2 seamTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The whole rung, not a per-module filter: `-Pseam.module` exists so one agent session pays
      # for one module (ADR-0018 §Session rule), and CI is the actor that has to pay for all of it.
      - run: ./gradlew seamTest

  # --- L3 -----------------------------------------------------------------------------------
  #
  # ADR-0022 §Who runs which rung: on merge into `main`, when the change touches the backend or
  # `dialect` (a package inside the backend, so `backend/**` covers both) — plus `local-env/**`,
  # since the bed L3 runs against is as able to break the rung as the code is.
  #
  # `main` is the last automatic gate, so this is not a required status check on a pull request; it
  # goes red on `main` after the merge. That is the ADR's design, not a gap.
  e2e:
    name: L3 e2eTest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scope decision below diffs the pushed range; a shallow checkout has neither end.
          fetch-depth: 0

      - name: Decide what this run does
        id: plan
        working-directory: .
        # Two questions, answered in one place so the steps below read as a plan rather than as a
        # pile of conditions.
        #
        # `rung` — does the rung run at all? ADR-0022 scopes L3 to changes that touch the backend
        # (`dialect` is a package inside it) or the bed itself. A docs-only merge has nothing for
        # L3 to say.
        #
        # `bed` — does the #9 test bed come up? Only if the rung has tests to run against it.
        # `rungs.gradle.kts` already rules twice that an empty rung is a pass
        # (`failOnNoDiscoveredTests = false`, and a Docker probe that only bites once the source
        # set has classes); standing up 6 GB of images to run zero tests would be the one place CI
        # disagreed with the build. The check is for sources rather than a hand-maintained list, so
        # the first e2e test to land turns the bed on by existing.
        run: |
          set -o pipefail

          if find backend/src/e2eTest -name '*.java' -print -quit 2>/dev/null | grep -q .; then
            has_tests=true
          else
            has_tests=false
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            rung=true
            # The whole point of the manual trigger: prove the runner can host the bed before any
            # test depends on it.
            if [ "${{ inputs.start_test_bed }}" = "true" ]; then bed=true; else bed="$has_tests"; fi
          else
            # `git diff` rather than `on.push.paths`, which would gate every job in this file
            # including L1 and L2. A force-push or a first push reports an all-zero base, and the
            # honest answer to "what changed" is then "assume everything".
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              touched=true
            elif git diff --name-only "$base" "${{ github.sha }}" \
                 | grep -qE '^(backend|local-env)/'; then
              touched=true
            else
              touched=false
            fi
            rung="$touched"
            if [ "$touched" = "true" ] && [ "$has_tests" = "true" ]; then bed=true; else bed=false; fi
          fi

          echo "rung=$rung" >> "$GITHUB_OUTPUT"
          echo "bed=$bed" >> "$GITHUB_OUTPUT"
          echo "::notice::L3 plan — run rung: $rung; start #9 test bed: $bed (tests present: $has_tests)."

      # No disk-reclaim step. One stood here, on the belief that the bed's ~8.5 GB had to fit in a
      # runner with ~14 GB free. The first dispatched run measured the runner instead: 145 GB total,
      # 86 GB free before anything is deleted, and 98 GB still free with all five services up. The
      # step bought nothing, and a step that states a reason which is not true is worse than no step.
      - name: Start the #9 test bed
        if: steps.plan.outputs.bed == 'true'
        working-directory: local-env
        # MySQL's seed builds a 25 MiB high-entropy blob server-side, which is why the compose file
        # gives it a 300s start_period; `--wait` honours the healthchecks rather than racing them.
        run: |
          set -o pipefail
          ./fetch-plugins.sh
          docker compose build connect
          docker compose up -d --wait
          docker compose ps

      # The measurement #9 recorded on a mac, taken again on the runner that now has to host it.
      # First reading, 2026-09-17: bed healthy in 91s; images 7.12 GB, volumes 2.15 GB; 4.1 GiB of
      # the runner's 15 GiB in use; 98 GB of disk still free.
      - name: Record what the bed costs here
        if: steps.plan.outputs.bed == 'true'
        working-directory: .
        run: |
          set -o pipefail
          echo "--- disk ---"; df -h / | tail -1
          echo "--- images ---"; docker system df
          echo "--- memory ---"; free -h

      - uses: actions/setup-java@v4
        if: steps.plan.outputs.rung == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: steps.plan.outputs.rung == 'true'
      - run: ./gradlew e2eTest
        if: steps.plan.outputs.rung == 'true'

      # Reading `docker compose ps` alone after a failure says which service died but never why.
      - name: Test bed logs on failure
        if: failure() && steps.plan.outputs.bed == 'true'
        working-directory: local-env
        run: docker compose logs --tail 200

      - name: Stop the #9 test bed
        if: always() && steps.plan.outputs.bed == 'true'
        working-directory: local-env
        run: docker compose down -v
